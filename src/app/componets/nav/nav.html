<header class="header">
  <h1>My Anular Routing Guide</h1>
  <nav>
    <ul>
      <li>
        <!-- relative route -->
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </li>
      <li>
        <!-- absolute route -->
        <a routerLink="about" routerLinkActive="active">About</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active">Contacts</a>
      </li>
      <!-- property-binding route -->
      <li>
        <a [routerLink]="`${myProductPath}`" routerLinkActive="active">Products</a>
      </li>

      <li>
        <a [routerLink]="'dashboard'" routerLinkActive="active">Dashboard</a>
      </li>
      <li>
        <a [routerLink]="'rxjs-promise'" routerLinkActive="active">Rxjs-promise</a>
      </li>
      <li>
        <a [routerLink]="'subject'" routerLinkActive="active">Rxjs-Subject</a>
      </li>
      <li>
        <a [routerLink]="'signal'" routerLinkActive="active">Rxjs-Signal</a>
      </li>
    </ul>
    <select (change)="handleSelectChange($event)">
      <option value="$">Price in $</option>
      <option value="$">Price in $</option>
      <option value="#">Price in #</option>
      <option value="€">Price in €</option>
    </select>
  </nav>
</header>
